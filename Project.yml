# Solipsist — macOS app wrapping the Boris content compiler.
#
# This project is generated with XcodeGen (see Makefile). Do not hand-edit
# the generated Solipsist.xcodeproj — edit this spec and run `make generate`.

name: Solipsist
options:
  bundleIdPrefix: dev.drawmeanelephant
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Local dev builds: ad-hoc sign to run locally (no team required).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Solipsist:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
      - path: Sources/Chrome
      - path: Sources/Workspace
      - path: Sources/Play
      - path: Sources/Inspector
      - path: Sources/Companions
      - path: Sources/Models
      - path: Sources/Engine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.drawmeanelephant.solipsist
        PRODUCT_NAME: Solipsist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Solipsist
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 draw me an elephant"
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
    entitlements:
      path: Solipsist/Solipsist.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    preBuildScripts:
      - name: Embed Boris engine binary
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          "${SRCROOT}/scripts/embed-boris.sh" "${SRCROOT}" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"

  # M1 engine spike: a headless CLI that runs the bundled boris binary and
  # decodes its JSON contracts. Shares Sources/Models and Sources/Engine
  # with the app.
  spike:
    type: tool
    platform: macOS
    sources:
      - path: Sources/Models
      - path: Sources/Engine
      - path: Spike
    settings:
      base:
        PRODUCT_NAME: boris-spike
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Solipsist:
    build:
      targets:
        Solipsist: all
    run:
      config: Debug
  spike:
    build:
      targets:
        spike: all
    run:
      config: Debug
