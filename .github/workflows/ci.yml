name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Install swiftformat & swiftlint
        run: brew install swiftformat swiftlint
      - name: Run SwiftFormat
        run: swiftformat --lint .
      - name: Run SwiftLint
        run: swiftlint --strict

  spike:
    name: spike
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Generate project and compile spike
        run: make spike
      # Running the spike needs a boris binary. We do not vendor that.

  app:
    name: app
    runs-on: macos-15
    env:
      SKIP_EMBED_BORIS: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Generate project and compile the app
        run: make build

  fixtures:
    name: fixtures
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Decode checked-in contract fixtures
        run: make test

  fart:
    name: fart
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo "reserved — do not build the fart app"
