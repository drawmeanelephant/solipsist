name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Install swiftformat & swiftlint
        run: brew install swiftformat swiftlint
      - name: Run SwiftFormat
        run: swiftformat --lint .
      - name: Run SwiftLint
        run: swiftlint --strict

  spike:
    name: spike
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      # Same pin as #116 / release-notarize.yml (afterparty, boris#648).
      - name: Checkout pinned Boris engine
        uses: actions/checkout@v7
        with:
          repository: drawmeanelephant/boris
          path: boris
          ref: 6b930b7bd35a1803b365a073c226df22631dc3f7

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Host-only (macos-15 is arm64). Release still cross-builds fat slices.
      - name: Build host Boris
        run: |
          cd boris
          zig build -Doptimize=ReleaseFast

      - name: Generate project, compile, and run spike
        env:
          SOLIPSIST_BORIS_BIN: ${{ github.workspace }}/boris/zig-out/bin/boris
        run: |
          set -euo pipefail
          test -x "$SOLIPSIST_BORIS_BIN"
          make run-spike SPIKE_CONTENT="${{ github.workspace }}/boris/content" | tee "$RUNNER_TEMP/spike.out"
          grep -q "SPIKE OK" "$RUNNER_TEMP/spike.out"

  app:
    name: app
    runs-on: xcode-27
    env:
      SKIP_EMBED_BORIS: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Generate project and compile the app
        run: make build

  fixtures:
    name: fixtures
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Decode checked-in contract fixtures
        run: make test

  fart:
    name: fart
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo "reserved — do not build the fart app"
