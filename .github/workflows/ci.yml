name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doctor:
    name: doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check repository health and doctor regressions
        run: make doctor && make test-doctor

  lint:
    name: lint
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Install swiftformat & swiftlint
        run: brew install swiftformat swiftlint
      - name: Run SwiftFormat
        run: swiftformat --lint .
      - name: Run SwiftLint
        run: swiftlint --strict

  spike:
    name: spike
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7

      # Same pin as release-notarize.yml / vendor/boris-agent-kit
      # (main, boris/0.8.2).
      - name: Checkout pinned Boris engine
        uses: actions/checkout@v7
        with:
          repository: drawmeanelephant/boris
          path: boris
          ref: 3ab19adf4d57e9061d880288ec1a2774ffa46a8c

      - name: Install Zig
        uses: drawmeanelephant/zig-zouave@2d8510d62b517fa786279562cf8b1bdcf0c47b9f
        with:
          version: 0.17.0

      - name: Cache Zig build artifacts
        uses: actions/cache@v6
        with:
          path: boris/zig-cache
          key: zig-${{ runner.os }}-3ab19ad-${{ hashFiles('boris/build.zig.zon') }}
          restore-keys: |
            zig-${{ runner.os }}-3ab19ad-
            zig-${{ runner.os }}-

      # Host-only (macos-15 is arm64). Release still cross-builds fat slices.
      - name: Build host Boris
        run: |
          cd boris
          zig build -Doptimize=ReleaseFast

      - name: Generate project, compile, and run spike
        env:
          SOLIPSIST_BORIS_BIN: ${{ github.workspace }}/boris/zig-out/bin/boris
        run: |
          set -euo pipefail
          test -x "$SOLIPSIST_BORIS_BIN"
          make test-spike
          make run-spike SPIKE_CONTENT="${{ github.workspace }}/boris/content" | tee "$RUNNER_TEMP/spike.out"
          grep -q "SPIKE OK" "$RUNNER_TEMP/spike.out"

  app:
    name: app
    runs-on: xcode-27
    env:
      SKIP_EMBED_BORIS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
      - name: Generate project and compile the app
        run: make build

      # When SKIP_EMBED_BORIS=1 the app compiles without a bundled engine.
      # Assert that the Resources directory does NOT contain a boris binary
      # — a stale cache could silently ship an old embedded engine.
      - name: Assert no stale boris in bundle
        run: |
          APP_PATH="build/Build/Products/Debug/Solipsist.app"
          if [ -f "$APP_PATH/Contents/Resources/boris" ]; then
            echo "FAIL: Contents/Resources/boris exists but SKIP_EMBED_BORIS=1" >&2
            exit 1
          fi
          echo "app: bundle OK (no embedded boris, as expected with SKIP_EMBED_BORIS=1)"

  fixtures:
    name: fixtures
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
      - name: Decode checked-in contract fixtures
        run: make test

  fart:
    name: fart
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo "reserved — do not build the fart app"
