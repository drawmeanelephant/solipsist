name: Release & Notarize

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      skip_notarize:
        description: 'Skip Apple Notarization (build and package only)'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-notarize:
    name: Build, Sign & Notarize Universal macOS App
    runs-on: xcode-27
    # Repo default GITHUB_TOKEN is read-only; softprops/action-gh-release needs write.
    permissions:
      contents: write
    # secrets.* is illegal in steps.if and GitHub rejects the whole workflow at
    # startup (empty jobs, "workflow file issue"). Job-level env is the documented
    # gate; an unset secret is an empty string and the step is skipped.
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      CODE_SIGN_IDENTITY: ${{ secrets.CODE_SIGN_IDENTITY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Same pin the app bundles and the site deploys (D7):
      # vendor/boris-agent-kit/MANIFEST.json. Moving pins are not reproducible.
      - name: Checkout Boris engine
        uses: actions/checkout@v7
        with:
          repository: drawmeanelephant/boris
          path: boris
          ref: 3ab19adf4d57e9061d880288ec1a2774ffa46a8c

      - name: Set up Xcode
        run: |
          # xcode-27 runners ship Xcode at a versioned path (e.g.
          # /Applications/Xcode_27_beta_4.app) with no /Applications/Xcode.app
          # symlink, and already default xcode-select to it — nothing to
          # switch. Verify the active toolchain instead.
          xcode-select -p
          xcodebuild -version

      - name: Install Zig
        uses: drawmeanelephant/zig-zouave@2d8510d62b517fa786279562cf8b1bdcf0c47b9f
        with:
          version: 0.17.0

      # embed-boris.sh lipo-merges discrete arches when both are provided;
      # zig cross-compiles macOS slices from either host arch.
      - name: Build universal Boris engine + companion tools
        run: |
          cd boris
          # Engine
          zig build -Dtarget=aarch64-macos -Doptimize=ReleaseFast --prefix /tmp/boris-arm64
          zig build -Dtarget=x86_64-macos -Doptimize=ReleaseFast --prefix /tmp/boris-x86_64
          lipo -create -output /tmp/boris-universal /tmp/boris-arm64/bin/boris /tmp/boris-x86_64/bin/boris
          lipo -info /tmp/boris-universal

          # boris-editor builds from its own build.zig (editor/build.zig),
          # not the root zig build — cross-build it per arch too.
          zig build --build-file editor/build.zig -Dtarget=aarch64-macos -Doptimize=ReleaseFast --prefix /tmp/boris-editor-arm64
          zig build --build-file editor/build.zig -Dtarget=x86_64-macos -Doptimize=ReleaseFast --prefix /tmp/boris-editor-x86_64

          # Companion tools: cross-build each arch, lipo-merge.
          # boris-search-index is present in the kit but unused by the app —
          # do not build or bundle it. boris-content-audit graduated to its
          # own repository (boris#834) and no longer builds from this checkout.
          for tool in boris-editor; do
            if [ -f "/tmp/boris-editor-arm64/bin/$tool" ] && [ -f "/tmp/boris-editor-x86_64/bin/$tool" ]; then
              lipo -create -output "/tmp/boris-universal-$tool" \
                "/tmp/boris-editor-arm64/bin/$tool" "/tmp/boris-editor-x86_64/bin/$tool"
              lipo -info "/tmp/boris-universal-$tool"
            else
              echo "WARNING: $tool not found in both arch builds — embedding host-only"
            fi
          done
          TOOLS="boris-package boris-source-rag"
          for tool in $TOOLS; do
            if [ -f "/tmp/boris-arm64/bin/$tool" ] && [ -f "/tmp/boris-x86_64/bin/$tool" ]; then
              lipo -create -output "/tmp/boris-universal-$tool" \
                "/tmp/boris-arm64/bin/$tool" "/tmp/boris-x86_64/bin/$tool"
              lipo -info "/tmp/boris-universal-$tool"
            else
              echo "WARNING: $tool not found in both arch builds — embedding host-only"
            fi
          done

      # The compiled Svelte shell is platform-independent — one build feeds
      # the bundle (embed-boris.sh bundles editor/ui/dist verbatim and
      # never runs npm itself).
      - name: Build editor UI
        run: |
          cd boris/editor/ui
          npm ci
          npm run build

      # Drop universal companion binaries into the kit bin dir embed
      # searches so embed-boris.sh finds them during the release build.
      - name: Populate universal companion tools
        run: bash scripts/populate-universal-companions.sh SUPPORT-NOT-FOR-GITHUB/boris-agent-kit/bin

      - name: Install tools & generate project
        run: |
          make tools
          make generate

      - name: Set up Signing Keychain
        if: ${{ env.APPLE_CERTIFICATE_BASE64 != '' }}
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'solipsist-build-keychain' }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed -e 's/^[[:space:]]*//' -e 's/"//g')

      - name: Build Universal Release App
        env:
          # Discrete arches so scripts/embed-boris.sh lipo-merges a fat engine.
          SOLIPSIST_BORIS_ARM64_BIN: /tmp/boris-arm64/bin/boris
          SOLIPSIST_BORIS_X86_64_BIN: /tmp/boris-x86_64/bin/boris
          CODE_SIGN_IDENTITY: ${{ secrets.CODE_SIGN_IDENTITY || '-' }}
        run: |
          xcodebuild -project Solipsist.xcodeproj -scheme Solipsist -configuration Release \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
            ENABLE_HARDENED_RUNTIME=YES \
            build

      - name: Package DMG
        run: |
          mkdir -p dist
          APP_PATH="build/Build/Products/Release/Solipsist.app"
          DMG_PATH="dist/Solipsist.dmg"

          echo "==> Creating DMG from $APP_PATH"
          hdiutil create -volname "Solipsist" \
            -srcfolder "$APP_PATH" \
            -ov -format UDZO \
            "$DMG_PATH"

      - name: Sign DMG
        if: ${{ env.CODE_SIGN_IDENTITY != '' && env.CODE_SIGN_IDENTITY != '-' }}
        env:
          CODE_SIGN_IDENTITY: ${{ secrets.CODE_SIGN_IDENTITY }}
        run: |
          codesign --force --sign "$CODE_SIGN_IDENTITY" --timestamp dist/Solipsist.dmg

      - name: Notarize App & DMG
        if: ${{ inputs.skip_notarize != true && env.APPLE_API_KEY_BASE64 != '' }}
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER: ${{ secrets.APPLE_API_KEY_ISSUER }}
        run: |
          AUTH_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$AUTH_KEY_PATH"

          echo "==> Submitting dist/Solipsist.dmg to Apple Notary Service"
          xcrun notarytool submit "dist/Solipsist.dmg" \
            --key "$AUTH_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_KEY_ISSUER" \
            --wait

          echo "==> Stapling notarization ticket to DMG and App"
          xcrun stapler staple "dist/Solipsist.dmg"
          xcrun stapler staple "build/Build/Products/Release/Solipsist.app"

      - name: Inspect bundle & embedded engine
        run: |
          APP_PATH="build/Build/Products/Release/Solipsist.app"
          echo "==> Inspecting Mach-O bundle structure:"
          file "$APP_PATH/Contents/MacOS/Solipsist"

          # Engine: must be universal and runnable.
          if [ -f "$APP_PATH/Contents/Resources/boris" ]; then
            lipo -info "$APP_PATH/Contents/Resources/boris"
            "$APP_PATH/Contents/Resources/boris" --version
          else
            echo "FAIL: Contents/Resources/boris missing from the release bundle" >&2
            exit 1
          fi

          # Oliver renderer: must be present and universal — a sandboxed
          # app cannot fall back to SOLIPSIST_OLIVER_BIN (#292).
          OLIVER_PATH="$APP_PATH/Contents/Resources/oliver"
          if [ -f "$OLIVER_PATH" ]; then
            echo "==> oliver:"
            lipo -info "$OLIVER_PATH"
          else
            echo "FAIL: Contents/Resources/oliver missing from the release bundle (sandboxed apps cannot exec outside the bundle)" >&2
            exit 1
          fi

          # Companion tools: must be present and universal.
          # boris-content-audit graduated to its own repo (boris#834) and is
          # bundled opportunistically, not required.
          COMPANIONS="boris-editor boris-package boris-source-rag"
          for comp in $COMPANIONS; do
            COMP_PATH="$APP_PATH/Contents/Resources/$comp"
            if [ -f "$COMP_PATH" ]; then
              echo "==> $comp:"
              lipo -info "$COMP_PATH"
            else
              echo "FAIL: Contents/Resources/$comp missing from the release bundle" >&2
              exit 1
            fi
          done

      # Hard Gatekeeper gate for real releases (a Developer ID is configured).
      # Ad-hoc/dev builds skip: spctl cannot pass without a Developer ID root.
      - name: Verify Gatekeeper assessment
        if: ${{ env.CODE_SIGN_IDENTITY != '' && env.CODE_SIGN_IDENTITY != '-' }}
        run: |
          APP_PATH="build/Build/Products/Release/Solipsist.app"
          echo "==> spctl --assess -vvv (app-bundle invocation)"
          spctl --assess -vvv "$APP_PATH"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Solipsist-macOS
          path: |
            dist/Solipsist.dmg
            build/Build/Products/Release/Solipsist.app

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/Solipsist.dmg
          generate_release_notes: true
