name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

concurrency:
  group: deploy-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: macos-15
    steps:
      - name: Checkout Solipsist
        uses: actions/checkout@v7

      # D7 pin: the same engine commit the app bundles (vendor/boris-agent-kit).
      # main is the integration line; moving pins are not reproducible.
      - name: Checkout Boris compiler
        uses: actions/checkout@v7
        with:
          repository: drawmeanelephant/boris
          path: boris
          ref: 3ab19adf4d57e9061d880288ec1a2774ffa46a8c

      # Same pin boris's own CI uses (github-pages.yml); `master` tarballs
      # rotate out of the mirrors and 404.
      - name: Install Zig
        uses: drawmeanelephant/zig-zouave@2d8510d62b517fa786279562cf8b1bdcf0c47b9f
        with:
          version: 0.17.0
      - name: Build Boris engine
        run: |
          cd boris
          zig build -Doptimize=ReleaseFast

      # The profile declares the target, layout rule, sitemap, site URL, and
      # static dir; `build --profile` executes all of it. Explicit selectors
      # alongside --profile now hit the consistency-check refusal (0.8.2+).
      - name: Compile documentation site
        run: |
          cd site
          ../boris/zig-out/bin/boris build --profile boris.json

      - name: Check internal links and sitemap
        run: python3 scripts/check-site-links.py --root site/dist --base-url https://solipsist.filed.fyi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=solipsist
