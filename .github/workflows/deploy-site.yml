name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

concurrency:
  group: deploy-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: macos-15
    steps:
      - name: Checkout Solipsist
        uses: actions/checkout@v7

      # D7 pin: the same afterparty engine commit the app bundles. `main` on
      # boris is the stale v0.8.0 line; moving pins are not reproducible.
      - name: Checkout Boris compiler
        uses: actions/checkout@v7
        with:
          repository: drawmeanelephant/boris
          path: boris
          ref: b82e9e2eace74d9ca61df23dffc1329d2a2fe628

      # Same pin boris's own CI uses (github-pages.yml); `master` tarballs
      # rotate out of the mirrors and 404.
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build Boris engine
        run: |
          cd boris
          zig build -Doptimize=ReleaseFast

      # The single public target is synthesized as "default"; the home layout
      # is selected per-page because the profile schema's layout_rules are not
      # executed by this compiler slice. --site-url feeds sitemap.xml.
      - name: Compile documentation site
        run: |
          cd site
          ../boris/zig-out/bin/boris build --profile boris.json \
            --layout-rule default id:index themes/boris/layouts/home.html \
            --sitemap --site-url https://solipsist.filed.fyi

      - name: Add root-level static files
        run: cp site/robots.txt site/dist/robots.txt

      - name: Check internal links and sitemap
        run: python3 scripts/check-site-links.py --root site/dist --base-url https://solipsist.filed.fyi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=solipsist
