name: Bug Report
description: Report a defect in the Solipsist macOS application
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report! Solipsist is the native macOS harness for Boris.
  - type: input
    id: macos_version
    attributes:
      label: macOS Version
      description: e.g. macOS 26.5 (Tahoe), 27.5 (Golden Gate)
      placeholder: macOS 26.5
    validations:
      required: true
  - type: input
    id: boris_version
    attributes:
      label: Boris Engine Version
      description: Output of `boris --version` or status bar identity
      placeholder: boris/0.8.1
    validations:
      required: true
  - type: input
    id: opened_target
    attributes:
      label: Content Opened
      description: What folder or project did you open? (e.g. Stunts/happy, custom corpus)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include any exit code or status bar message.
    validations:
      required: true
  - type: input
    id: exit_code
    attributes:
      label: Exit Code (if any)
      placeholder: e.g. 0, 1, 2
