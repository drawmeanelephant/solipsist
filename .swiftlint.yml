disabled_rules:
  - control_statement
  - trailing_comma

line_length:
  warning: 180
  error: 240

indentation: 4

included:
  - Sources
  - Tests

excluded:
  - Sources/App
  - Sources/Chrome
  - Sources/Workspace
  - Sources/Play
  - Sources/Inspector
  - Sources/Engine
  - Sources/Models
  - Spike
  - SUPPORT-NOT-FOR-GITHUB
  - vendor
  - Stunts
  - build

trailing_whitespace:
  ignores_empty_lines: true
